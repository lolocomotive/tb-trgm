name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check tag matches manifest version
        run: |
          MANIFEST=$(node -p 'require("./src/manifest.json").version')
          if [ "v$MANIFEST" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $MANIFEST" >&2
            exit 1
          fi
      - run: npm test
      - name: Build
        id: build
        run: echo "xpi=$(sh build.sh)" >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.xpi }}" \
            --title "$GITHUB_REF_NAME" --generate-notes
